<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StyleLens — Cửa hàng thời trang tìm bằng hình ảnh</title>
  <meta name="description" content="StyleLens full-stack: cửa hàng thời trang tìm sản phẩm bằng ảnh (React + FastAPI + Qdrant), gợi ý sản phẩm tương tự, giỏ hàng và đặt hàng." />
  <script>
    // Đặt theme sáng/tối trước khi React chạy để trang không bị nháy màu khi tải.
    // Khóa 'stylelens-fs.theme' phải khớp với CONFIG.THEME_KEY trong src/config.js.
    (function () {
      var t = 'light';
      try {
        t = localStorage.getItem('stylelens-fs.theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      } catch (e) {
        t = 'light';
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
