server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx mặc định chỉ nhận thân request tối đa 1 MB: ảnh chụp từ điện thoại (2–5 MB) gửi lên
    # /api/v1/search/image hoặc /api/v1/admin/items sẽ bị chặn ngay ở đây với lỗi 413, chưa tới
    # được backend. Nâng lên 6 MB = giới hạn 5 MB của backend (MAX_FILE_BYTES) + phần đầu multipart.
    client_max_body_size 6m;

    # SPA dùng HashRouter (điều hướng qua #/...) nên hầu như không cần rewrite phía server —
    # try_files vẫn được giữ để phục vụ đúng các tệp tĩnh (JS/CSS/ảnh) và có phương án dự
    # phòng hợp lý nếu URL không khớp tệp nào.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API sang service `api` trong docker-compose.yml — nhờ vậy trình duyệt luôn gọi
    # cùng origin (đường dẫn tương đối trong src/lib/api.js), không cần cấu hình CORS.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
    }
}
